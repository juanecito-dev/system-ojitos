name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formato y Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, intl, zip, dom
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Formato (Pint)
        run: ./vendor/bin/pint --test
      - name: Larastan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  pruebas:
    name: Pruebas (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, gd, intl, zip, dom
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Preparar
        run: cp .env.example .env && php artisan key:generate
      - name: Pruebas
        run: php artisan test

  pruebas-mysql:
    name: Pruebas (PHP 8.3, MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ojitos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ojitos_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, intl, zip, dom
          coverage: none
      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Preparar
        run: cp .env.example .env && php artisan key:generate
      - name: Pruebas
        run: php artisan test
