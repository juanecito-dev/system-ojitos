function bindProd(root){
  const q = $("pr-q"); q.oninput = () => { prodQ = q.value; const pos = q.selectionStart; renderSettings(); const n = $("pr-q"); n.focus(); n.setSelectionRange(pos, pos); };
  root.querySelectorAll("[data-name]").forEach(inp => inp.onchange = () => { const it = catalog.find(i => i.id === inp.dataset.name); const v = inp.value.trim(); if (it && v) { logAct("producto", "Renombró «" + it.n + "» a «" + v + "»"); it.n = v; saveCatalog(); toast("Nombre guardado"); } else if (it) inp.value = it.n; });
  root.querySelectorAll("input[data-id]").forEach(inp => inp.onchange = () => {
    const it = catalog.find(i => i.id === inp.dataset.id), j = +inp.dataset.j, c = toC(inp.value);
    if (!it) return;
    if (!isFinite(c) || c <= 0) { inp.value = N(it.ops[j].p); toast("Escribe un precio válido, por ejemplo 0.50"); return; }
    const old = it.ops[j].p; if (old === c) return; it.ops[j].p = c; inp.value = N(c); saveCatalog();
    logAct("precio", it.n + (it.ops.length > 1 ? " (" + (it.ops[j].l || "opción " + (j + 1)) + ")" : "") + ": " + S(old) + " → " + S(c)); if (it.costo) renderSettings(); toast("Precio guardado");
  });
  root.querySelectorAll("[data-costo]").forEach(inp => inp.onchange = () => {
    const it = catalog.find(i => i.id === inp.dataset.costo); if (!it) return; const old = it.costo;
    const v = inp.value.trim(); if (v === "") delete it.costo; else { const c = toC(v); if (!(c >= 0)) { inp.value = it.costo ? N(it.costo) : ""; return toast("Escribe el costo, por ejemplo 0.42"); } it.costo = c; }
    saveCatalog(); logAct("precio", "Costo de " + it.n + ": " + (old ? S(old) : "—") + " → " + (it.costo ? S(it.costo) : "—")); renderSettings(); toast("Costo guardado");
  });
  root.querySelectorAll("[data-stock]").forEach(inp => inp.onchange = () => {
    const id = inp.dataset.stock, v = inp.value.trim();
    if (v === "") delete stockBase[id]; else { const n = parseInt(v,10); if (!(n >= 0)) { inp.value = stock[id] ?? ""; toast("Escribe un número, por ejemplo 24"); return; } stockSet(id, n); }
    saveStock(); toast("Stock guardado");
  });
  root.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const idx = catalog.findIndex(i => i.id === b.dataset.rm); if (idx < 0) return;
    const bak = catalog[idx]; catalog.splice(idx,1); saveCatalog(); logAct("producto", "Quitó el producto " + bak.n); renderSettings();
    toast("Quitado: " + bak.n, {label:"Deshacer", fn: () => { catalog.splice(idx, 0, bak); saveCatalog(); logAct("producto", "Volvió a poner " + bak.n); renderSettings(); }});
  });
  root.querySelectorAll("[data-fav]").forEach(b => b.onclick = () => { const it = catalog.find(i => i.id === b.dataset.fav); if (!it) return; it.fav = !it.fav; if (!it.fav) delete it.fav; saveCatalog(); b.textContent = it.fav ? "★" : "☆"; b.style.color = it.fav ? "var(--yellow)" : "var(--soft)"; toast(it.fav ? it.n + " en favoritos" : it.n + " quitado de favoritos"); });
  root.querySelectorAll("[data-cb]").forEach(inp => inp.onchange = () => {
    const it = catalog.find(i => i.id === inp.dataset.cb); if (!it) return;
    const codes = inp.value.split(/[\s,;]+/).filter(Boolean), dup = codes.map(c => catalog.find(x => x !== it && codesOf(x).includes(c))).find(Boolean);
    if (dup) { inp.value = it.cb || ""; return toast("Ese código ya es de " + dup.n); }
    if (codes.length) it.cb = codes.join(" "); else delete it.cb; inp.value = it.cb || ""; saveCatalog(); toast("Código guardado");
  });
  $("a-add").onclick = openAddProduct;
  $("a-masivo").onclick = openMasivo;
  $("a-grupo").onclick = openRenGrupo;
  if ($("a-reset")) $("a-reset").onclick = async () => { if (await ask("¿Volver a los productos y precios iniciales? Tus cambios de precios se perderán.", {ok:"Volver a los iniciales", danger:true})) { catalog = clone(DEFAULT); saveCatalog(); logAct("precio", "Volvió a los productos y precios iniciales"); render(); toast("Listo, precios iniciales"); } };
}
// sube o baja los precios de un grupo entero, con vista previa
function openMasivo(){

  openSheet(`<h3>Cambiar precios por grupo</h3><p class="hint">Por ejemplo, si subió el papel: «Copias e impresiones A4», subir 10%. Revisa la vista previa antes de aplicar.</p>
    <div class="set two"><label style="grid-column:1/-1">Grupo<select id="ms-g">${gs.map(g => `<option>${esc(g)}</option>`).join("")}</select></label>
      <label>Cambio<select id="ms-m"><option value="pct">Porcentaje (%)</option><option value="sol">Monto fijo (S/)</option></select></label>
      <label>Cuánto (negativo para bajar)<input id="ms-v" inputmode="decimal" placeholder="Ej.: 10"></label>
      <label style="grid-column:1/-1">Redondear a<select id="ms-r"><option value="1" selected>Céntimo exacto</option><option value="5">0.05</option><option value="10">0.10</option><option value="50">0.50</option></select></label></div>
    <div id="ms-prev" style="max-height:260px;overflow:auto;margin:8px 0"></div>
    <p class="cap" id="ms-err" style="color:var(--magenta)"></p>
    <div class="actions paybar"><button class="btn big" id="ms-ok">Aplicar cambios</button></div>`);
  const calc = () => { const g = $("ms-g").value, m = $("ms-m").value, v = parseFloat(String($("ms-v").value).replace(",", ".")), r = +$("ms-r").value;
    if (!isFinite(v) || !v) return [];
    return catalog.filter(i => i.g === g).flatMap(i => i.ops.map((o, j) => { let p = m === "pct" ? o.p * (1 + v / 100) : o.p + Math.round(v * 100); p = Math.max(r, Math.round(p / r) * r); return {i, j, old:o.p, p}; })).filter(x => x.p !== x.old); };
  const prev = () => { const L = calc(); $("ms-prev").innerHTML = L.length ? `<table><thead><tr><th>Producto</th><th class="r">Antes</th><th class="r">Ahora</th></tr></thead><tbody>${L.map(x => `<tr><td>${esc(x.i.n)}${x.i.ops.length > 1 ? " · " + esc(x.i.ops[x.j].l || "") : ""}</td><td class="r">${N(x.old)}</td><td class="r"><b>${N(x.p)}</b></td></tr>`).join("")}</tbody></table>` : `<p class="cap">Escribe cuánto cambiar para ver la vista previa.</p>`; };
  ["ms-g", "ms-m", "ms-r"].forEach(id => $(id).onchange = prev); $("ms-v").oninput = prev; prev();
  $("ms-ok").onclick = async () => { const L = calc(); if (!L.length) return $("ms-err").textContent = "No hay cambios que aplicar.";
    if (!await ask("¿Cambiar " + L.length + (L.length === 1 ? " precio" : " precios") + " de «" + $("ms-g").value + "»?", {ok:"Aplicar"})) return;
    L.forEach(x => { x.i.ops[x.j].p = x.p; }); saveCatalog();
    logAct("precio", "Cambió " + L.length + " precios de «" + $("ms-g").value + "» (" + ($("ms-m").value === "pct" ? $("ms-v").value + "%" : "S/ " + $("ms-v").value) + "): " + L.slice(0, 6).map(x => x.i.n + " " + N(x.old) + "→" + N(x.p)).join(", ") + (L.length > 6 ? "…" : ""));
    closeSheet(); renderSettings(); toast(L.length + " precios actualizados"); };
}

async function restaurarCopia(file){
  if (!file) return;

  if (d.app !== "ojitos-caja") return toast("Ese archivo no es una copia de esta caja");
  if (!await ask("¿Restaurar la copia del " + (d.creado || "").slice(0,10) + "? Se reemplazan los datos actuales por los de la copia, en todos los equipos." + (downloads ? " Antes se descargará una copia de lo que hay ahora." : ""), {ok:"Continuar", danger:true})) return;
  const a = await autorizar("datos", "Restaurar la copia del " + (d.creado || "").slice(0, 10), {forzar:true, soloAdmin:true, incluirme:true, titulo:"Confirma con el PIN de un administrador", motivo:"Es un cambio grande que afecta a todos los equipos."}); if (!a) return;
  if (downloads && !await descargarCopia("antes-de-restaurar")) { if (!await ask("No se pudo descargar la copia de lo actual. ¿Restaurar de todos modos?", {ok:"Restaurar igual", danger:true})) return; }
  if (d.negocio) { negocio = {...NEG_DEFAULT, ...d.negocio}; saveNegocio(); }
  if (Array.isArray(d.catalog)) { catalog = migrateCatalog(d.catalog, CAT_V); saveCatalog(); }
  stockBase = d.stockBase || baseFromCounts(d.stock || {}); stockLog = d.stockLog || []; saveStock();
  if (Array.isArray(d.pedidos)) { pedidos.splice(0, pedidos.length, ...d.pedidos); LS.set("pedMig", 1); savePed(); } else if (Array.isArray(d.encargos)) { encargos = d.encargos; LS.set("pedMig", ""); pedidos.splice(0); migrarPedidos(); }
  if (Array.isArray(d.plantillas)) { plantillas.splice(0, plantillas.length, ...d.plantillas); savePlant(); }
  if (d.clientes) { cli = d.clientes; saveCli(); }
  if (d.compras) { comp = d.compras; saveComp(); }
  if (d.maquinas && Array.isArray(d.maquinas.items)) { maqCfg.items.splice(0, maqCfg.items.length, ...d.maquinas.items); maqCfg.prods = d.maquinas.prods || {}; maqCfg.ult = d.maquinas.ult || {}; saveMaq(); }
  Object.entries(d.dias || {}).forEach(([k, v]) => { days[k] = v; saveDay(k); });
  if (Array.isArray(d.documentos) && db) d.documentos.forEach(r => { if (r && r.id) { queue(() => db.doc("documentos/" + r.id).set(clone(r))); indexAdd("docs", r.id); } });
  if (Array.isArray(d.modelos)) { modelos = d.modelos.filter(m => m && m.id); LS.set("modelos", modelos); if (db) modelos.forEach(m => { queue(() => db.doc("modelos/" + m.id).set(clone(m))); indexAdd("mods", m.id); }); }
  if (d.usuarios && Array.isArray(d.usuarios.items) && d.usuarios.items.some(u => u.rol === "admin")) { users = d.usuarios.items; if (Array.isArray(d.usuarios.roles) && d.usuarios.roles.length) roles = d.usuarios.roles; saveUsers(); if (me) me = users.find(u => u.id === me.id) || null; }
  docHist = null; logAct("datos", "Restauró la copia del " + (d.creado || "").slice(0, 10) + " (autorizó " + a.nombre + ")");
  if (!me) return showLogin();
  render(); toast("Copia restaurada");
}

// PIN nuevo: PBKDF2 con 150 000 vueltas (mucho más lento de adivinar que un hash simple). Los PIN antiguos se actualizan al entrar.
async function hashPin2(pin, salt){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pin)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", salt: new TextEncoder().encode(salt), iterations: 150000, hash: "SHA-256"}, key, 256);
  return "p2:" + [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function newPinHash(pin, salt){ try { return await hashPin2(pin, salt); } catch(e) { return hashPin(pin, salt); } }
async function checkPin(u, pin){ return String(u.pin || "").startsWith("p2:") ? (await hashPin2(pin, u.salt)) === u.pin : (await hashPin(pin, u.salt)) === u.pin; }
async function hashPin(pin, salt){
  try { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2,"0")).join(""); }
  catch(e) { let h = 0; const str = salt + ":" + pin; for (let i = 0; i < str.length; i++) h = (h*31 + str.charCodeAt(i)) | 0; return "x" + h; }
}

// intentos fallidos: se guardan en el usuario (valen en todos los equipos) y también en este equipo
function pinBloq(u){
  const f = u.bloq || {}, l = LS.get("pinfail:" + u.id) || {}, until = Math.max(f.until || 0, l.until || 0);
  return until > Date.now() ? "Demasiados intentos. Espera " + Math.ceil((until - Date.now()) / 1000) + " segundos." : "";
}
function pinFallo(u){
  const n = Math.max((u.bloq && u.bloq.n) || 0, (LS.get("pinfail:" + u.id) || {}).n || 0) + 1, until = n >= 5 ? Date.now() + Math.min(300, 30 * (n - 4)) * 1000 : 0;
  u.bloq = {n, until}; LS.set("pinfail:" + u.id, {n, until}); saveUsers();
  if (n === 5) logAct("bloqueo", "PIN de " + u.nombre + " bloqueado por 5 intentos fallidos");
}

// permisos nuevos: los roles creados antes conservan lo que ya podían hacer
function migrarRoles(){
  let ch = false;
  roles.forEach(r => { if (r.fijo || (r.pv || 0) >= 2) return; const p = new Set(r.perms || []);
    if (p.has("caja")) p.add("gastos"); if (p.has("ventas")) p.add("verTodo"); if (p.has("reportes")) p.add("costos"); if (p.has("ajustes")) { p.add("precios"); p.add("negocio"); p.add("datos"); }
    r.perms = [...p]; r.pv = 2; ch = true; });
  return ch;
}
// si el usuario no tiene el permiso, alguien que sí lo tiene lo autoriza con su PIN en este mismo equipo
function autorizar(perm, que, opt = {}){
  if (!opt.forzar && can(perm)) return Promise.resolve(me);
  const ap = activos().filter(u => (opt.incluirme || !me || u.id !== me.id) && (u.rol === "admin" || (!opt.soloAdmin && roleOf(u).perms.includes(perm))));
  if (!ap.length) { toast("Esto necesita la autorización de un administrador"); return Promise.resolve(null); }
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "dlg"; d.setAttribute("role", "alertdialog"); d.setAttribute("aria-modal", "true");
    d.innerHTML = `<div><p><b>${opt.titulo || "Necesita autorización"}</b><br>${esc(que)}.${opt.motivo ? " " + esc(opt.motivo) : me && !opt.incluirme ? " Tu usuario no tiene este permiso: pide a " + (ap.length === 1 ? esc(ap[0].nombre.split(" ")[0]) : "un encargado") + " que ponga su PIN." : ""}</p>
      ${ap.length > 1 ? `<select class="field wide" id="az-u" style="width:100%;margin-bottom:10px">${ap.map(u => `<option value="${u.id}" ${me && u.id === me.id ? "selected" : ""}>${esc(u.nombre)}</option>`).join("")}</select>` : ""}
      <input class="field wide" id="az-p" type="password" inputmode="numeric" maxlength="6" placeholder="PIN de ${esc(ap.length === 1 ? ap[0].nombre.split(" ")[0] : "quien autoriza")}" style="width:100%;margin-bottom:6px" autocomplete="off">
      <p class="cap" id="az-e" style="color:var(--magenta);min-height:1.2em;margin:0 0 8px"></p>
      <div class="actions"><button class="btn ghost big" id="az-no">Cancelar</button><button class="btn big" id="az-ok">Autorizar</button></div></div>`;
    const done = r => { d.remove(); document.removeEventListener("keydown", kd, true); res(r); };
    const ok = async () => {
      const u = ap.length > 1 ? users.find(x => x.id === $("az-u").value) : ap[0], pin = $("az-p").value.trim(); if (!pin || !u) return;
      const bl = pinBloq(u); if (bl) { $("az-e").textContent = bl; return; }
      $("az-ok").disabled = true; const good = await checkPin(u, pin); $("az-ok").disabled = false;
      if (!good) { pinFallo(u); $("az-e").textContent = pinBloq(u) || "PIN incorrecto"; $("az-p").value = ""; $("az-p").focus(); return; }
      pinOk(u); if (!me || u.id !== me.id) logAct("autoriza", que + " — autorizó " + u.nombre); done(u);
    };
    const kd = e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(null); } else if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); ok(); } else if (e.key === "F9" || e.key === "F2") { e.preventDefault(); e.stopPropagation(); } };
    d.querySelector("#az-no").onclick = () => done(null); d.querySelector("#az-ok").onclick = ok;
    document.addEventListener("keydown", kd, true); document.body.appendChild(d); setTimeout(() => { const p = $("az-p"); if (p) p.focus(); }, 30);
  });
}

const descTotal = () => (pay.desc || 0) + order.reduce((a, l) => a + (l.lista && l.lista > l.precio ? (l.lista - l.precio) * l.cant : 0), 0);

async function cobrar(withTicket){
  if (pay.metodo === "fiado" && !can("fiar")) { if (!await autorizar("fiar", "Vender al fiado " + S(orderTotal() - (pay.desc || 0)))) return; }
  const d = descTotal();
  if (d > 0 && !can("descuentos")) { if (!await autorizar("descuentos", "Descuento de " + S(d))) return; }
  else if (excedeTope(d)) { const r = roleOf(me); if (!await autorizar("descuentos", "Descuento de " + S(d), {forzar:true, soloAdmin:true, motivo:"Pasa el tope de tu rol (" + [r.descMax ? S(r.descMax) : "", r.descPct ? r.descPct + "%" : ""].filter(Boolean).join(" o ") + "): un administrador debe autorizarlo."})) return; }
  registerSale(withTicket);
}

// day rollover: if the page stays open past midnight
setInterval(() => {
  const k = todayKey();
  if (!days[k]) { days[k] = {ventas:[], cierre:false}; if (viewDay < k) viewDay = k; softRender(); }
  if (db && watchedDay && watchedDay !== k) { watchedDay = k; watch("dias/" + k); consolidateStock().then(() => softRender()); }   // pasó la medianoche: vigilar el día nuevo
}, 60000);
})();
