<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ojitos · Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --sheet:#FFFFFF; --ink:#16191D; --soft:#5B6470; --line:#D9DEE4;
  --cyan:#0096C7; --magenta:#C81E63; --yellow:#E0AC00; --ok:#1E8A4C; --green:#2E9E5B;
  --cyan-bg:#E3F4FA; --mag-bg:#FBE6EE; --yel-bg:#FFF6D6; --ok-bg:#E3F3EA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15181C; --sheet:#1E2227; --ink:#EEF1F4; --soft:#9AA4AF; --line:#343A42;
    --cyan:#38BDE8; --magenta:#F0508E; --yellow:#FFD23F; --ok:#4CC37E; --green:#4CC37E;
    --cyan-bg:#12303B; --mag-bg:#3A1826; --yel-bg:#362D0C; --ok-bg:#153324;
  }
}
:root[data-theme="dark"]{
  --paper:#15181C; --sheet:#1E2227; --ink:#EEF1F4; --soft:#9AA4AF; --line:#343A42;
  --cyan:#38BDE8; --magenta:#F0508E; --yellow:#FFD23F; --ok:#4CC37E; --green:#4CC37E;
  --cyan-bg:#12303B; --mag-bg:#3A1826; --yel-bg:#362D0C; --ok-bg:#153324;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

.strip{display:flex;height:6px}
.strip i{flex:1}
.strip i:nth-child(1){background:var(--cyan)}
.strip i:nth-child(2){background:var(--magenta)}
.strip i:nth-child(3){background:var(--yellow)}
.strip i:nth-child(4){background:var(--ink)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px 14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:80%;font-size:1.3rem;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--soft);font-size:.8rem;margin-left:6px;font-stretch:100%}
.sync{font-size:.75rem;color:var(--soft);margin-left:auto;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:600;color:var(--soft);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--magenta);color:#fff;font-size:.7rem;text-align:center;margin-left:5px;padding:0 5px}
@media (max-width:640px){.tabs{order:3;width:100%}}

main{max-width:1080px;margin:0 auto;padding:14px 16px 150px}
h2{font-stretch:80%;font-weight:750;font-size:1.05rem;margin:22px 0 10px;color:var(--soft);display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:500;font-size:.8rem;font-stretch:100%}
h2:first-child{margin-top:4px}

/* search */
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;background:var(--paper);padding:4px 0 8px}
@media (max-width:640px){.search{top:calc(env(safe-area-inset-top,0px) + 104px)}}
.search input{width:100%;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px 14px;font-size:1rem}
.gnav{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.gnav::-webkit-scrollbar{display:none}
.gnav button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
.tile{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:13px 13px 11px 15px;min-height:80px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.tile:active{transform:scale(.96)}
.tile .n{font-weight:700;font-size:1rem;line-height:1.2;padding-right:22px}
.tile .p{color:var(--soft);font-size:.86rem;margin-top:6px}
.tile .low{font-style:normal;color:var(--magenta);font-weight:700;font-size:.78rem;display:block}
.tile::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--ink))}
.tile .badge{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:var(--paper);font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tile.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.05)}}
.t-bn{--c:var(--ink)} .t-color{--c:var(--magenta)} .t-foto{--c:var(--cyan)} .t-acab{--c:var(--yellow)} .t-util{--c:var(--green)} .t-otro{--c:var(--soft)}
.hint-line{color:var(--soft);font-size:.82rem;margin:-4px 0 10px}
.gnav button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gnav button small{opacity:.7;font-weight:700}
.favbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.tile .star{position:absolute;top:6px;right:9px;font-size:1.25rem;line-height:1;color:var(--soft)}
.tile.fav-on{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}
.tile.fav-on .star{color:var(--yellow)}
.kbd{display:none;font-size:.75rem;color:var(--soft);margin-top:6px}
.kbd kbd{font:inherit;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--sheet);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}
.lines li.ledit{flex-wrap:wrap;gap:8px;background:var(--paper);border-radius:10px;padding:10px;border:0;margin:4px 0}
.lines .d small s{opacity:.7}
.sheet .paybar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--sheet);margin:6px -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:2}
.qrbox{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:12px;padding:10px;margin:-4px 0 14px}
.qrbox img{width:112px;height:112px;object-fit:contain;background:#fff;border-radius:8px;cursor:zoom-in;flex:none}
.qrfull{position:fixed;inset:0;z-index:80;background:rgba(10,12,15,.8);display:flex;align-items:center;justify-content:center;padding:20px}
.qrfull>div{background:#fff;color:#111;border-radius:18px;padding:18px;text-align:center;max-width:420px;width:100%}
.qrfull img{width:100%;max-height:70vh;object-fit:contain}
.qrfull p{font-weight:800;font-size:1.3rem;margin:10px 0 14px}
.qrset{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.qrset>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qrset img,.qrset .qrph{width:130px;height:130px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}
.qrset .qrph{display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:.85rem;background:var(--paper)}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
  .grid.small{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
  .tile{min-height:68px;padding:10px 10px 9px 13px;border-radius:12px}
  .tile .n{font-size:.93rem}
  .tile .p{font-size:.82rem;margin-top:4px}
}

/* order bar */
.order{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.order-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px}
.order-sum{flex:1;min-width:0;cursor:pointer}
.order-items{font-size:.85rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-total{font-size:1.65rem;font-weight:800;font-stretch:85%;line-height:1.1}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--magenta);color:#fff}
.btn.big{padding:15px 18px;font-size:1.05rem;white-space:nowrap}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.35;cursor:default}
.link{border:0;background:none;color:var(--soft);text-decoration:underline;padding:6px}
a.btn{text-decoration:none;display:inline-block;text-align:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:10;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--sheet);border-radius:20px 20px 0 0;max-height:90%;overflow:auto;transform:translateY(105%);transition:transform .2s ease-out;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet{visibility:hidden}
.sheet.on{transform:none;visibility:visible}
@media (min-width:700px){.sheet{left:50%;right:auto;width:580px;margin-left:-290px}}
@media (prefers-reduced-motion:reduce){.sheet,.tile{transition:none}.tile.bump{animation:none}}
.sheet h3{margin:0 0 4px;font-size:1.3rem;font-stretch:85%}
.sheet .hint{color:var(--soft);font-size:.9rem;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;min-width:74px;text-align:center}
.chip b{display:block;font-size:1.05rem}
.chip small{color:var(--soft)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] small{color:var(--paper);opacity:.8}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.row > label{font-weight:600;min-width:80px}
.field{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;width:130px;font-size:1.05rem}
.field.wide{width:100%;flex:1}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--paper);width:46px;height:48px;font-size:1.4rem;font-weight:700}
.stepper input{border:0;width:74px;text-align:center;font-size:1.3rem;font-weight:700;background:var(--sheet);height:48px}
.stepper.sm button{width:34px;height:34px;font-size:1.1rem}
.stepper.sm span{min-width:34px;text-align:center;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 11px;font-weight:600}
.sub{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px;margin:4px 0 14px}
.sub strong{font-size:1.8rem;font-stretch:85%}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.lines{list-style:none;margin:0 0 12px;padding:0}
.lines li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lines .d{flex:1;min-width:0}
.lines .d small{color:var(--soft);display:block}
.lines .x{border:0;background:none;color:var(--soft);font-size:1.3rem;padding:4px 6px}
.note{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.93rem}
.note.warn{background:var(--yel-bg)}
.note.ok{background:var(--ok-bg)}
.note.info{background:var(--cyan-bg)}
.note.bad{background:var(--mag-bg)}
.check{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none}
.vuelto{font-weight:800;font-size:1.2rem}

/* cards */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{display:grid;gap:14px}
@media (min-width:760px){.hero{grid-template-columns:1.1fr 1fr 1fr}}
.hero .tot{font-size:2.9rem;font-weight:800;font-stretch:80%;line-height:1}
.cap{color:var(--soft);font-size:.9rem}
.close{border-radius:16px;padding:14px;background:var(--mag-bg)}
.close.done{background:var(--ok-bg)}
.close .amt{font-size:1.8rem;font-weight:800;font-stretch:85%}
.close p{margin:4px 0 10px;font-size:.88rem}
.methods{display:grid;gap:6px}
.methods div{display:flex;justify-content:space-between}
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.daybar input[type=date]{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px}
table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--soft);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:6px;bottom:6px;background:var(--cyan-bg);border-radius:4px;z-index:0}
.bar-cell span{position:relative}
.scroll{overflow-x:auto}
.sale{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.sale .t{color:var(--soft);font-size:.85rem;min-width:44px}
.sale .d{flex:1;min-width:0;font-size:.92rem}
.sale .amt{font-weight:800;font-size:1.1rem;text-align:right}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;margin:4px 4px 0 0}
.tag.b{background:var(--ok-bg);color:var(--ok)}
.tag.p{background:var(--yel-bg)}
.tag.s{background:var(--paper);color:var(--soft);border:1px solid var(--line)}
.tag.m{background:var(--cyan-bg)}
.tag.r{background:var(--mag-bg);color:var(--magenta)}
.sale .ops{display:flex;flex-direction:column;align-items:flex-end}
.empty{color:var(--soft);padding:26px;text-align:center;background:var(--sheet);border:1px dashed var(--line);border-radius:14px}
.helper dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 12px}
.helper dt{color:var(--soft)}
.helper dd{margin:0;font-weight:600;word-break:break-word}
.helper ol{margin:0 0 12px;padding-left:20px;color:var(--soft);font-size:.9rem}
.stack{display:grid;gap:8px}

/* encargos */
.enc{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px;border-left:5px solid var(--yellow)}
.enc.listo{border-left-color:var(--cyan)}
.enc.entregado{border-left-color:var(--line);opacity:.8}
.enc.late{border-left-color:var(--magenta)}
.enc .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.enc .who{font-weight:800;font-size:1.08rem}
.enc .money{text-align:right;font-weight:700}
.enc .det{margin:6px 0;white-space:pre-wrap}
.enc .meta{color:var(--soft);font-size:.86rem}
.enc .actions{margin-top:10px}
.seg{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* reports */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi .v{font-size:1.7rem;font-weight:800;font-stretch:85%}
#v-reportes .kpi .v{white-space:nowrap;font-size:clamp(1.15rem,2vw,1.7rem)}
.chart svg{width:100%;height:auto;display:block}

/* settings */
.set label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--soft);margin-bottom:10px}
.set input,.set select{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;font-size:1rem;color:var(--ink)}
.two{display:grid;gap:0 12px}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.pitem{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pitem .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pitem .h input{flex:1;font-weight:700;border:1.5px solid transparent;background:none;border-radius:8px;padding:4px 6px;font-size:1rem}
.pitem .h input:focus{border-color:var(--line);background:var(--paper)}
.pgrid{display:flex;flex-wrap:wrap;gap:8px}
.pgrid label{display:flex;flex-direction:column;font-size:.78rem;color:var(--soft);gap:2px}
.pgrid input{width:84px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px;font-size:1rem;color:var(--ink)}
details.grp{margin-bottom:10px}
details.grp summary{cursor:pointer;font-weight:750;font-stretch:85%;font-size:1.05rem;padding:8px 0}

/* ticket */
.ticket{background:#fff;color:#111;border-radius:6px;padding:18px 16px;margin:0 auto 14px;max-width:340px;font-family:"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.35;box-shadow:0 0 0 1px var(--line)}
.ticket .c{text-align:center}
.ticket .big{font-family:"Archivo",sans-serif;font-weight:800;font-size:22px;letter-spacing:.02em}
.ticket hr{border:0;border-top:1px dashed #888;margin:8px 0}
.ticket .l{display:flex;justify-content:space-between;gap:8px}
.ticket .tt{font-weight:700;font-size:15px}
.ticket .fine{font-size:11px;text-align:center}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;left:0;top:0;width:72mm}
  #print-area.doc{position:static;width:auto}
  #print-area.doc .docpage{box-shadow:none;padding:0;max-width:none;font-size:12pt}
  @page{margin:2.5cm 2.5cm 2.5cm 3cm}
  #print-area .ticket{box-shadow:none;margin:0;padding:0;max-width:none}
}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(10,12,15,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg>div{background:var(--sheet);color:var(--ink);border-radius:16px;padding:18px;max-width:440px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg p{margin:0 0 14px;white-space:pre-wrap;line-height:1.45}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 12px 10px 16px;border-radius:12px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.on{opacity:1;pointer-events:auto}
.toast button{border:0;background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700}

/* ===== modular shell ===== */
.side{position:fixed;top:0;bottom:0;left:0;width:236px;background:var(--sheet);border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .2s ease-out}
.side .brandbox{padding:16px 18px 12px}
.side .brand{font-size:1.5rem}
.side .who{color:var(--soft);font-size:.82rem;margin-top:2px}
.nav{list-style:none;margin:0;padding:6px 10px;overflow-y:auto;flex:1}
.nav .sec{font-size:.74rem;color:var(--soft);font-weight:700;padding:14px 10px 4px}

.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 6px}

.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center;margin:8px auto 0}

    document.addEventListener("keydown", kd, true);
    document.body.appendChild(d);
    setTimeout(() => { const f = o.input ? $("dlg-in") : d.querySelector('[data-r="1"]'); if (f) { f.focus(); if (o.input) f.select(); } }, 30);

  closeSheet(); render();
  const who = cliId ? cliName(cliId).split(" ")[0] : "";
  toast((v.metodo === "fiado" ? "Fiado a " + who + ": " + S(tot) : "Cobrado " + S(grand) + (who ? " a " + who : "") + (abono ? " (incluye deuda)" : "")) + (v.pago > tot ? ", vuelto " + S(v.pago - tot) : ""), {label:"Deshacer", fn: () => undoSale(k, v.id, encBak)});

}

/* ---- paso de Encargos y Proformas al nuevo formato (una sola vez, un solo equipo) ---- */
let migrando = false;
async function migrarPedidos(){
  if (migrando || LS.get("pedMig")) return; migrando = true;
  try {
    let profs = LS.get("proformas") || [];
    if (db) {
      const m = await db.doc("config/meta").get(); if (m.exists && m.data().pedidos) { LS.set("pedMig", 1); return; }
      const ref = db.doc("pedidos/lista"), l = await ref.acquire({holder: HOLDER, ttlMs: 20000});
      if (!l.acquired) { await sleep(4000); const s = await ref.get(); if (s.exists) { applyOrMerge("pedidos/lista", s.data()); LS.set("pedMig", 1); softRender(); } return; }
      const m2 = await db.doc("config/meta").get(); if (m2.exists && m2.data().pedidos) { LS.set("pedMig", 1); return; }
      const s = await db.collection("proformas").get(); const cloud = s.docs.map(x => x.data()); const ids = new Set(cloud.map(x => x.id)); profs = [...cloud, ...profs.filter(x => !ids.has(x.id))];
      const se = await db.doc("encargos/lista").get(); if (se.exists && se.data().items) encargos = fromMap(se.data().items);
    }
    const out = [], byId = {}, have = new Set(pedidos.map(p => p.id));
    profs.forEach(p => { if (!p || !p.id || have.has(p.id)) return;
      const P = {id:p.id, num:p.num || null, t:p.t || Date.now(), fecha:p.fecha || todayKey(), etapa: p.estado === "rechazada" ? "rechazado" : p.estado === "aceptada" ? "entregado" : "cotizado", cotizada:true,
        cliente:{nombre:"", doc:"", cel:"", inst:"", dir:"", ...(p.cliente || {})}, items:p.items || [], detalle:"", monto:0, desc:p.desc || 0, validez:p.validez || 7,
        cEntrega:p.entrega || "", cPago:p.pago || "", notas:p.notas || "", pagos:[], u:p.u, vend:p.vend, fEntrega:"", hora:""};
      if (p.cliId) P.cliId = p.cliId;
      if (p.aceptadaEn) P.aceptadoEn = p.aceptadaEn;
      if (P.etapa === "entregado") { P.directa = true; P.entregadoEn = p.aceptadaEn || p.t; P.pagos.push({id:uid(), t:P.entregadoEn, monto:pedTotal(P), metodo:"", legacy:true}); }
      if (P.etapa === "rechazado") P.cerradoEn = p.tu || p.t;
      out.push(P); byId[p.id] = P; });
    encargos.forEach(e => { if (!e || !e.id || have.has(e.id)) return;
      const et = e.estado === "entregado" ? "entregado" : e.estado === "listo" ? "listo" : "proceso";
      let P = e.prof && byId[e.prof];
      if (P) { (P.alias ||= []).push(e.id); P.pagos = []; delete P.directa; }
      else { P = {id:e.id, num:null, t:e.creado || Date.now(), fecha:keyOf(new Date(e.creado || Date.now())), cliente:{nombre:e.cliente || "", doc:"", cel:e.cel || "", inst:"", dir:""}, items:[], detalle:e.detalle || "", monto:e.total || 0, desc:0, validez:7, cEntrega:"", cPago:"", notas:"", pagos:[], u:e.u, vend:e.vend, hora:""}; out.push(P); }
      P.etapa = et; P.fEntrega = e.entrega || "";
      if (et === "listo") P.listoEn = Date.now();
      if (e.entregadoEn) P.entregadoEn = e.entregadoEn;
      if (e.adelanto) P.pagos.push({id:uid(), t:e.creado || Date.now(), monto:e.adelanto, metodo:"", legacy:true, tipo:"Adelanto"});
      if (et === "entregado") { const f = pedTotal(P) - pedPagado(P); if (f > 0) P.pagos.push({id:uid(), t:P.entregadoEn || Date.now(), monto:f, metodo:"", legacy:true, tipo:"Saldo"}); }
      if (!P.cliId && e.cel) { const cc = cel9(e.cel), c = cc.length === 9 && cli.clientes.find(x => cel9(x.cel) === cc); if (c) P.cliId = c.id; } });
    let n = Math.max(maxPedNum(), ...out.map(p => p.num || 0));
    out.sort((a, b) => a.t - b.t).forEach(p => { if (!p.num) p.num = ++n; p.total = pedTotal(p); });
    pedidos.push(...out);
    if (db) {
      const ref = db.doc("config/contadores"), s = await ref.get(), cur = Math.max(n, s.exists ? (s.data().pedido || 0) : 0, s.exists ? (s.data().proforma || 0) : 0);
      if (s.exists) await ref.update({pedido: cur}); else await ref.set({pedido: cur});
      const mref = db.doc("config/meta"), ms = await mref.get(); if (ms.exists) await mref.update({pedidos: true}); else await mref.set({pedidos: true});
    }
    savePed(); LS.set("pedMig", 1);
    if (out.length) { toast("Tus encargos y proformas ahora están en Pedidos (" + out.length + ")"); softRender(); }
  } catch(e) { console.error(e); }
  finally { migrando = false; }
}
// los pedidos cerrados hace tiempo pasan a un documento por mes (así la lista activa no se llena)
async function archivarPedidos(){
  if (!db || !LS.get("pedMig")) return;
  const size = JSON.stringify(pedidos).length, lim = Date.now() - (size > 150000 ? 2 : 20) * 864e5;
  const cierre = p => p.entregadoEn || p.cerradoEn || (pedEtapa(p) === "vencido" ? dateOfKey(pedVence(p)).getTime() : 0);
  const viejos = pedidos.filter(p => { const e = pedEtapa(p), tc = cierre(p); return (e === "entregado" || e === "rechazado" || e === "vencido") && tc && tc < lim; });
  if (!viejos.length) return;
  const by = {}; viejos.forEach(p => { (by[keyOf(new Date(cierre(p))).slice(0, 7)] ||= {})[p.id] = clone(p); });
  queue(async () => {
    for (const [m, items] of Object.entries(by)) { const ref = db.doc("pedidos/h-" + m); try { await ref.update({items}); } catch(e) { if (e && e.code === "invalid_argument") await ref.set({items}); else throw e; } indexAdd("peds", "h-" + m); }
    const ids = new Set(viejos.map(p => p.id)); pedidos.splice(0, pedidos.length, ...pedidos.filter(p => !ids.has(p.id))); savePed();
  });
}
let pedArch = null, pedArchMeses = 0;
async function cargarArchivo(){
  if (!db) return; pedArch ||= [];
  const base = new Date(); const ps = [];
  for (let i = pedArchMeses; i < pedArchMeses + 4; i++) { const d = new Date(base.getFullYear(), base.getMonth() - i, 1); ps.push(db.doc("pedidos/h-" + keyOf(d).slice(0, 7)).get().catch(() => null)); }
  pedArchMeses += 4;
  (await Promise.all(ps)).forEach(s => { if (s && s.exists) fromMap(s.data().items).forEach(p => { if (!pedArch.some(x => x.id === p.id)) pedArch.push({...p, __arch:true}); }); });
}

async function entregarPed(p, again){
  const sal = pedSaldo(p);
  if (!sal) {
    const bak = clone(p); p.etapa = "entregado"; p.entregadoEn = Date.now(); pedLog(p, "Entregado"); stockSalida(p); savePed(p); again && again();
    toast("Entregado", {label:"Deshacer", fn: () => { stockQuitar(p); Object.keys(p).forEach(k => delete p[k]); Object.assign(p, bak); savePed(p); render(); }});
    return;
  }
  if (order.length && !(await ask("Hay un pedido en la caja. Para cobrar este saldo se reemplazará. ¿Continuar?"))) return;
  order = [{sid:"pedido", nombre:"Saldo pedido " + pedNum(p.num), det:pedDesc(p).slice(0, 60), cant:1, precio:sal, sub:sal}];
  pendingEnc = p.id; pendingDir = false; pay = PAY0(); prefillPayPed(p);
  render(); openPay();
}
async function cobrarDirecto(p){
  if (pedEtapa(p) === "vencido" && !(await ask("Esta cotización venció el " + fdate(dateOfKey(pedVence(p)).getTime()) + ". Se cobrará con los precios de ese día. ¿Continuar?", {ok:"Cobrar igual"}))) return;
  if (order.length && !(await ask("Hay un pedido en la caja. ¿Reemplazarlo por esta cotización?"))) return;
  const items = (p.items || []).length ? p.items : [{sid:"pedido", nombre:"Pedido " + pedNum(p.num), det:(p.detalle || "").slice(0, 60), cant:1, precio:pedTotal(p), sub:pedTotal(p)}];
  order = items.map(l => ({sid:l.sid || "pedido", nombre:l.nombre, det:[l.det, pedNum(p.num)].filter(Boolean).join(" · "), cant:l.cant, precio:l.precio, sub:l.sub}));
  pay = PAY0(); if (p.desc && can("descuentos")) pay.desc = p.desc; else if (p.desc) toast("La cotización tenía descuento, pero tu usuario no puede aplicarlo");
  prefillPayPed(p); pendingEnc = p.id; pendingDir = true; closeSheet(); go("vender"); setTimeout(openPay, 250);
}

// precio de hoy: el del catálogo para ese producto y opción; si ya no existe, el de la lista
function precioHoy(l){ const it = l.sid && catalog.find(i => i.id === l.sid); if (!it || !it.ops.length) return l.precio || 0; const o = (l.det && it.ops.find(x => x.l === l.det)) || (it.ops.length === 1 ? it.ops[0] : null); return o ? o.p : (l.precio || 0); }
const plantItems = t => (t.items || []).map(l => { const pr = precioHoy(l); return {sid:l.sid, nombre:l.nombre, det:l.det || "", cant:l.cant, precio:pr, sub:pr * l.cant}; });

function dayStats(D){

/* ---- caja por usuario: cada persona abre su turno con su sencillo y lo cierra contando su efectivo ---- */
const inWin = (x, t) => x.t >= t.abre && (!t.cierra || x.t <= t.cierra);
const efectivo = x => (x.metodo || "efectivo") === "efectivo";

  const V = (D.ventas || []).filter(v => v.u === t.u && inWin(v, t)), M = ((D.caja && D.caja.movs) || []).filter(m => m.u === t.u && inWin(m, t) && efectivo(m));
  const sum = tp => M.filter(m => m.tipo === tp).reduce((a, m) => a + m.monto, 0);
  const ventas = V.filter(efectivo).reduce((a, v) => a + v.total, 0), ing = sum("ingreso"), gas = sum("gasto"), ret = sum("retiro");
  return {ventas, n: V.length, ing, gas, ret, esperado: (t.inicial || 0) + ventas + ing - gas - ret};

// ventas y movimientos en efectivo que no caen en ningún turno (se vendió sin abrir caja)
function sinTurno(D){

  const fuera = x => x.u ? !T.some(t => t.u === x.u && inWin(x, t)) : !T.length ? true : false;
  const V = (D.ventas || []).filter(v => efectivo(v) && fuera(v)), M = ((D.caja && D.caja.movs) || []).filter(m => efectivo(m) && fuera(m));
  const total = V.reduce((a, v) => a + v.total, 0) + M.reduce((a, m) => a + (m.tipo === "ingreso" ? m.monto : -m.monto), 0);

  const sum = tp => M.filter(m => m.tipo === tp).reduce((a, m) => a + m.monto, 0);
  return (cj.inicial || 0) + V.filter(v => !v.u).reduce((a, v) => a + v.total, 0) + sum("ingreso") - sum("gasto") - sum("retiro");
}

/* ================= FACTURACIÓN (comprobantes electrónicos) ================= */
const REGIMENES = {nrus:{n:"Nuevo RUS", fact:false}, rer:{n:"Régimen Especial (RER)", fact:true}, rmt:{n:"Régimen MYPE Tributario (RMT)", fact:true}, general:{n:"Régimen General", fact:true}};
const IGV_OPS = {exonerado:"Exonerado (Amazonía y otras zonas)", gravado:"Gravado con IGV 18% (precios incluyen IGV)", inafecto:"Inafecto"};
const TIPOS_CPE = {"03":"Boleta", "01":"Factura", "07":"Nota de crédito", "08":"Nota de débito"};
const TIPOS_DOC = [["1","DNI"],["6","RUC"],["4","Carnet de extranjería"],["7","Pasaporte"],["0","Sin documento"]];
const fcfg = () => ({regimen: negocio.regimen || "rer", igv: negocio.igv || "exonerado", serieB: negocio.serieB || "EB01", serieF: negocio.serieF || "E001", modo: negocio.modoCpe || "manual"});
const puedeFactura = () => (REGIMENES[fcfg().regimen] || REGIMENES.rer).fact;
const serieDe = tipo => tipo === "01" ? fcfg().serieF : fcfg().serieB;
const MAX_SIN_DOC = 70000;   // boletas de más de S/ 700 deben llevar el documento del comprador
function rucOk(r){ r = String(r || "").replace(/\D/g, ""); if (!/^(10|15|16|17|20)\d{9}$/.test(r)) return false; const w = [5,4,3,2,7,6,5,4,3,2]; const sum = w.reduce((a, x, i) => a + x * +r[i], 0); let d = 11 - (sum % 11); if (d === 10) d = 0; if (d === 11) d = 1; return d === +r[10]; }
function docOk(td, nd){ nd = String(nd || "").trim(); return td === "6" ? rucOk(nd) : td === "1" ? /^\d{8}$/.test(nd) : td === "0" ? true : nd.length >= 5; }
function montosCpe(total){ const m = fcfg().igv; if (m === "gravado") { const base = Math.round(total / 1.18); return {grav: base, exo: 0, ina: 0, igv: total - base}; } return {grav: 0, exo: m === "exonerado" ? total : 0, ina: m === "inafecto" ? total : 0, igv: 0}; }
const cpeLabel = c => (c.serie ? c.serie + "-" + (c.num || "?") : "Sin número");
const docTxt = d => d && d.nd ? (TIPOS_DOC.find(x => x[0] === d.td) || ["", "Doc."])[1] + " " + d.nd + (d.nom ? " · " + d.nom : "") : "Sin documento";
function numUsado(serie, num, exceptId){ if (!num) return null; const n = String(+num); let f = null; Object.values(days).forEach(D => (D.cpes || []).forEach(c => { if (!f && c.id !== exceptId && c.estado !== "anulado" && c.serie === String(serie).toUpperCase() && c.num === n) f = c; })); return f; }
function ultimoNum(serie){ let n = Math.max(LS.get("ult:" + serie) || 0, +negocio["ult_" + serie] || 0); Object.values(days).forEach(D => (D.cpes || []).forEach(c => { if (c.serie === serie && +c.num > n) n = +c.num; })); return n; }

function bindCpeBox(sh){

function prefillDoc(){ const c = pay.cliId && cli.clientes.find(x => x.id === pay.cliId); if (!c) return; if (c.dni) { pay.doc.nd = c.dni; pay.doc.td = c.dni.length === 11 ? "6" : "1"; } if (!pay.doc.nom && !/^Cliente \d{4}$/.test(c.nombre)) pay.doc.nom = c.nombre; if (!pay.doc.dir && (c.dir || c.dom)) pay.doc.dir = c.dir || c.dom; }
function cpeCheck(propioTot){
  if (pay.cpe === "01") { if (!puedeFactura()) return "Tu régimen no permite emitir facturas."; if (!rucOk(pay.doc.nd)) return "Para factura escribe un RUC válido."; if (!pay.doc.nom) return "Para factura escribe la razón social."; }
  const td = pay.cpe === "01" ? "6" : pay.doc.td;
  if (pay.doc.nd && !docOk(td, pay.doc.nd)) return "Revisa el número de documento del cliente.";
  if (pay.boleta && pay.cpe === "03" && propioTot > MAX_SIN_DOC && !pay.doc.nd) return "Esta boleta pasa de S/ 700: escribe el DNI del cliente.";
  if (pay.boleta && pay.cpeNum && numUsado(pay.cpeSerie || serieDe(pay.cpe), pay.cpeNum)) return "Ese número de comprobante ya está registrado.";
  return "";
}
function cpeReqFromPay(propioTot){
  const doc = pay.doc.nd ? {td: pay.cpe === "01" ? "6" : pay.doc.td, nd: pay.doc.nd, nom: pay.doc.nom || "", dir: pay.doc.dir || ""} : null;
  const pide = pay.cpe === "01" || pay.pide || !!doc;
  if (!pide && pay.cpe === "03") return null;
  return {tipo: pay.cpe, pide, ...(doc ? {doc} : {})};
}

/* ---- registrar un comprobante emitido ---- */
function emitirCpe({tipo, serie, num, cliente, total, ventas, desc, cierreDe, ref, motivo}){
  const k = todayKey(), D = day(k); D.cpes ||= [];
  const c = {id: uid(), t: Date.now(), tipo, serie: (serie || serieDe(tipo)).toUpperCase(), num: num ? String(+num) : "", cliente: cliente || null, total, ...montosCpe(Math.abs(total)), ventas: ventas || [], desc: (desc || "").slice(0, 250), estado: "emitido", modo: fcfg().modo, ...(ref ? {ref} : {}), ...(motivo ? {motivo} : {}), ...(cierreDe ? {cierreDe} : {}), ...firma()};
  D.cpes.push(c); saveDay(k);
  if (c.num) { const u = LS.get("ult:" + c.serie) || 0; if (+c.num > u) LS.set("ult:" + c.serie, +c.num); if (+c.num > (+negocio["ult_" + c.serie] || 0)) { negocio["ult_" + c.serie] = String(+c.num); saveNegocio(); } }
  (ventas || []).forEach(({k: kk, id}) => { const v = (days[kk] || day(kk)).ventas.find(x => x.id === id); if (v) { v.boleta = true; v.cpe = c.id; v.cpeK = k; v.cpeNum = c.num ? cpeLabel(c) : ""; if (kk !== k) saveDay(kk); } });
  if (cierreDe) { const DD = days[cierreDe] || day(cierreDe); DD.cierre = true; DD.cierreCpe = c.id; if (cierreDe !== k) saveDay(cierreDe); }
  if ((ventas || []).some(x => x.k === k) || cierreDe === k) saveDay(k);
  return c;
}
const cierreCubierto = D => !!(D.cierre && !D.cierreCpe);   // días anteriores a este módulo: la boleta de cierre ya se marcó sin detalle
function diasRestan(k){ return Math.round((dateOfKey(addDays(k, 7)) - dateOfKey(todayKey())) / 864e5); }
function plazoTag(k){ const r = diasRestan(k); return r < 0 ? `<span class="tag r">Plazo vencido</span>` : r === 0 ? `<span class="tag r">Vence hoy</span>` : r <= 2 ? `<span class="tag p">Vence en ${r} día${r > 1 ? "s" : ""}</span>` : `<span class="tag s">${r} días de plazo</span>`; }
// los días anteriores quedan guardados en el equipo; antes de mostrar o registrar comprobantes se traen de nuevo de la nube
async function refrescarDias(keys){ if (!db) return; await Promise.all(keys.map(async k => { try { const s = await db.doc("dias/" + k).get(); if (s.exists) applyRemote("dias/" + k, s.data()); } catch(e) {} })); }
async function yaTieneCpe(x){
  if (!db) return null;
  try { const s = await db.doc("dias/" + x.k).get(); if (!s.exists) return null; applyRemote("dias/" + x.k, s.data());
    const D = days[x.k] || {}, ids = x.kind === "venta" ? [x.v.id] : (x.ids || []);
    const con = (D.ventas || []).filter(v => ids.includes(v.id) && (v.boleta || v.cpe));
    if (con.length) return "Ya se registró " + (con[0].cpeNum || "un comprobante") + " para " + (ids.length > 1 ? "estas ventas" : "esta venta") + " desde otro equipo. No se guardó nada: cierra esta ventana y revisa la lista, que ya se actualizó.";
  } catch(e) {}

function aplicarCompra(f){
  recomputeStock();
  (f.items || []).forEach(l => {
    const it = l.sid && catalog.find(i => i.id === l.sid); if (!it || !(l.unid > 0)) return;
    if (!stockBase[l.sid]) stockBase[l.sid] = {n:0, t:Date.now() - 1};
    const actual = Math.max(0, stock[l.sid] || 0), cu = l.sub / l.unid;
    l.costoAnt = it.costo ?? null;
    it.costo = r2(actual > 0 && it.costo ? (actual * it.costo + l.unid * cu) / (actual + l.unid) : cu);
    l.costoNuevo = it.costo; it.ultC = {c:r2(cu), prov:f.prov, fecha:f.fecha};
    stockLog.push({k:uid(), t:Date.now(), id:l.sid, nombre:it.n, tipo:"entrada", cant:l.unid, costo:r2(cu), compra:f.id, nota:provName(f.prov) + (f.numero ? " " + f.numero : ""), ...firma()});
    recomputeStock();

}
function revertirCompra(f){
  const quitar = stockLog.filter(l => l.compra === f.id);
  if (quitar.length) {
    const keep = stockLog.filter(l => l.compra !== f.id); stockLog.splice(0, stockLog.length, ...keep);
    quitar.forEach(e => { const b = stockBase[e.id]; if (b && e.t <= b.t) stockLog.push({k:uid(), t:Date.now(), id:e.id, nombre:e.nombre, tipo:"salida", cant:e.cant, nota:"Compra corregida o eliminada", ...firma()}); });   // ya estaba dentro del cierre diario del stock
    saveStock();

  let cc = false;
  (f.items || []).slice().reverse().forEach(l => { const it = catalog.find(i => i.id === l.sid); if (it && l.costoNuevo != null && it.costo === l.costoNuevo) { if (l.costoAnt == null) delete it.costo; else it.costo = l.costoAnt; cc = true; } });

}

    clausulas: [
      {id:"inmueble", h: com ? "EL LOCAL" : "EL INMUEBLE", n:1, t:d => { const tipo = com ? "local" : (d.tipo || "casa"), fem_ = tipo === "casa"; return "EL ARRENDADOR es propietario de" + (com ? "l local comercial" : fem_ ? " la casa" : tipo === "cuarto" ? "l cuarto" : "l " + tipo) + " ubicad" + (fem_ ? "a" : "o") + " en " + X(d.dir) + ", distrito de " + X(d.dist) + ", provincia de " + X(d.prov) + ", departamento de " + X(d.dep) + (d.descr ? ", que consta de " + V(d, "descr").replace(/\.$/, "") : "") + ", en adelante EL INMUEBLE."; }},

      ...(com ? [{id:"licencia", h:"LICENCIAS Y AUTORIZACIONES", n:1, t:() => "EL ARRENDATARIO tramitará y pagará, por su cuenta, la licencia de funcionamiento, el certificado de inspección técnica de seguridad y las demás autorizaciones que exija su giro, siendo responsable de las multas y sanciones que se impongan por su actividad. EL ARRENDADOR entregará las copias de los documentos del inmueble que se requieran para dichos trámites."}] : []),
      {id:"oblInq", h:"OBLIGACIONES DE EL ARRENDATARIO", n:2, t:() => "Son obligaciones de EL ARRENDATARIO: a) pagar puntualmente la renta y los servicios; b) conservar EL INMUEBLE en buen estado y efectuar las reparaciones menores derivadas de su uso; c) no subarrendar ni ceder EL INMUEBLE, total o parcialmente, sin autorización escrita de EL ARRENDADOR; d) no realizar modificaciones ni mejoras sin autorización escrita; las que se hagan quedarán a beneficio de EL INMUEBLE, sin derecho a reembolso; e) permitir la inspección de EL INMUEBLE, previo aviso; y f) devolver EL INMUEBLE al término del contrato en el mismo estado en que lo recibe, salvo el desgaste por su uso ordinario."},
      {id:"oblArr", h:"OBLIGACIONES DE EL ARRENDADOR", n:2, t:() => "Son obligaciones de EL ARRENDADOR: a) entregar EL INMUEBLE en buen estado de uso; b) mantener a EL ARRENDATARIO en el uso pacífico de EL INMUEBLE durante la vigencia del contrato; y c) realizar las reparaciones necesarias que no se deriven del uso de EL ARRENDATARIO."},
      {id:"inventario", h:"ESTADO E INVENTARIO", n:3, t:d => "EL INMUEBLE se entrega en buen estado de conservación, con sus instalaciones eléctricas y sanitarias operativas" + (lineas(V(d, "inventario")).length ? ", junto con los siguientes bienes:" : ", lo que EL ARRENDATARIO declara conocer y aceptar."), li:d => lineas(V(d, "inventario")).map((x, i) => String.fromCharCode(97 + i) + ") " + x.replace(/[.;]$/, "") + ".")},
      {id:"mejoras", h:"MEJORAS" + (com ? " Y ANUNCIOS" : ""), n: com ? 2 : 3, t:() => "EL ARRENDATARIO no podrá introducir mejoras, cambios ni instalaciones en EL INMUEBLE sin autorización escrita de EL ARRENDADOR. Las mejoras que se realicen quedarán en beneficio de EL INMUEBLE sin derecho a reembolso, salvo que puedan retirarse sin daño, en cuyo caso EL ARRENDATARIO podrá retirarlas al término del contrato." + (com ? " La colocación de letreros o anuncios del negocio requiere autorización de EL ARRENDADOR y de la municipalidad, y serán retirados por EL ARRENDATARIO al término del contrato." : "")},
      {id:"resol", h:"RESOLUCIÓN", n:2, t:() => "EL ARRENDADOR podrá resolver el presente contrato si EL ARRENDATARIO no paga la renta del mes anterior y se vence otro mes y además quince (15) días, conforme al inciso 1 del artículo 1697 del Código Civil, así como por incumplimiento de cualquiera de las obligaciones de EL ARRENDATARIO, comunicándolo por escrito."},
      {id:"devol", h:"DEVOLUCIÓN Y PENALIDAD", n:3, t:d => { const pd = Math.round(toC(d.renta) / 30); return "Al vencimiento del plazo o a la resolución del contrato, EL ARRENDATARIO devolverá EL INMUEBLE desocupado, limpio y con los servicios al día. Por cada día de demora en la devolución, pagará a EL ARRENDADOR una penalidad de " + (pd > 0 ? montoTxt(pd) : "S/ [COMPLETAR]") + ", equivalente a un día de renta, hasta la entrega efectiva, sin perjuicio de lo dispuesto en el artículo 1704 del Código Civil."; }},

    ]
  });
}

    {id:"objeto", h:"OBJETO", n:1, t:d => "Por el presente contrato, EL VENDEDOR da en venta a favor de EL COMPRADOR el vehículo descrito en la cláusula anterior, en adelante EL VEHÍCULO, incluyendo sus llaves" + (d.acc ? " y los siguientes accesorios: " + V(d, "acc").replace(/\.$/, "") : "") + "."},

    {id:"estado", h:"ESTADO DEL VEHÍCULO", n:2, t:() => "EL COMPRADOR declara haber revisado EL VEHÍCULO y lo recibe en el estado de conservación y funcionamiento en que se encuentra, el cual conoce y acepta. Sin perjuicio de ello, EL VENDEDOR responde por los vicios ocultos conforme a ley."},
    {id:"saneam", h:"SANEAMIENTO", n:2, t:() => "EL VENDEDOR declara que EL VEHÍCULO es de su exclusiva propiedad y que sobre él no pesa gravamen, embargo, garantía mobiliaria, orden de captura, medida judicial o administrativa alguna que limite su libre disposición, obligándose al saneamiento por evicción conforme a ley."},
    {id:"entrega", h:"ENTREGA Y RESPONSABILIDADES", n:1, t:d => "EL VENDEDOR entrega EL VEHÍCULO a EL COMPRADOR el " + fechaLarga(d.entrega) + (d.hora ? ", a las " + d.hora : "") + ". Son de exclusiva responsabilidad de EL VENDEDOR las papeletas, multas, deudas, tributos, accidentes y cualquier obligación civil, penal o administrativa relacionada con EL VEHÍCULO originadas hasta dicho momento; y de EL COMPRADOR, las que se originen a partir de él."},
    {id:"docs", h:"DOCUMENTOS QUE SE ENTREGAN", n:3, t:() => "Con EL VEHÍCULO, EL VENDEDOR entrega a EL COMPRADOR la Tarjeta de Identificación Vehicular, el certificado del Seguro Obligatorio de Accidentes de Tránsito (SOAT) y el certificado de inspección técnica vehicular, de tenerlos vigentes, así como los demás documentos que sustentan su propiedad."},
    {id:"papeletas", h:"PAPELETAS Y REQUISITORIAS", n:3, t:() => "EL VENDEDOR declara que a la fecha EL VEHÍCULO no registra papeletas pendientes de pago ni requisitorias. Si aparecieran papeletas, multas o requisitorias por hechos ocurridos antes de la entrega, EL VENDEDOR se obliga a regularizarlas por su cuenta dentro de los diez (10) días de requerido, respondiendo por los daños que su demora ocasione a EL COMPRADOR."},
    {id:"riesgo", h:"TRANSFERENCIA DEL RIESGO", n:3, t:() => "A partir de la entrega, EL COMPRADOR asume el riesgo de pérdida o deterioro de EL VEHÍCULO no imputable a las partes, conforme al artículo 1567 del Código Civil, así como la responsabilidad por su uso y circulación."},
    {id:"formal", h:"FORMALIZACIÓN", n:2, t:d => "Las partes se obligan a suscribir el Acta de Transferencia Vehicular ante notario público para la inscripción de la transferencia en el Registro de Propiedad Vehicular de la SUNARP, en un plazo no mayor de quince (15) días desde la firma del presente. EL VENDEDOR entregará la Tarjeta de Identificación Vehicular y los demás documentos necesarios. Los gastos notariales y registrales serán asumidos por " + X(d.gastos) + "."},
    {id:"incump", h:"INCUMPLIMIENTO", n:3, t:d => incumplimientoVenta(d)}
  ]
}),

contrato({
  id:"locacion", nombre:"Contrato por servicio", icon:"🤝",
  desc:"Locación de servicios: trabajos independientes, asesorías, obras menores, diseño, limpieza, etc.",
  nota:"Es un contrato civil (arts. 1764 al 1770 del Código Civil): el locador trabaja con autonomía, sin horario ni subordinación. Ojo: si en la práctica cumple horario fijo, recibe órdenes y trabaja de forma permanente, SUNAFIL o un juez puede considerarlo una relación laboral (principio de primacía de la realidad), aunque el contrato diga lo contrario.",
  campos:[
    {id:"tipoCom", label:"Quien contrata (el comitente) es", type:"select", opts:[["natural","Una persona"],["empresa","Una empresa o negocio con RUC"]], def:"natural"},
    {id:"empresa", label:"Razón social de la empresa", full:true, req:true, when:d => d.tipoCom === "empresa", ph:"Ej.: Comercial Huallaga E.I.R.L."},
    {id:"ruc", label:"RUC de la empresa", num:true, req:true, when:d => d.tipoCom === "empresa"},
    {id:"domEmp", label:"Domicilio de la empresa", full:true, req:true, when:d => d.tipoCom === "empresa"},
    {id:"repCargo", label:"Cargo del representante", def:"Gerente General", when:d => d.tipoCom === "empresa", ph:"Ej.: Gerente General, Titular"},
    {t:"persona", id:"com", label:"Comitente (o su representante, si es empresa)", sinEc:true, sinDom:true},
    {id:"com_dom", label:"Domicilio del comitente", full:true, req:true, when:d => d.tipoCom !== "empresa"},
    {t:"persona", id:"loc", label:"Locador (quien presta el servicio)", sinEc:true},
    {id:"loc_prof", label:"Profesión u oficio del locador (opcional)", ph:"Ej.: técnico electricista"},
    {id:"loc_ruc", label:"RUC del locador (opcional)", num:true},
    {t:"h", label:"El servicio"},
    {id:"servicio", label:"Qué servicio va a prestar", type:"area", req:true, full:true, pulir:"descripción precisa del servicio en una frase nominal; sigue a «el siguiente servicio:» y termina sin punto", ph:"Ej.: instalación eléctrica completa de un local comercial de 80 m², incluyendo tablero, tomacorrientes e iluminación"},
    {id:"lugar", label:"Dónde se presta (opcional)", full:true, ph:"Ej.: Jr. Tito Jaime N° 245, Tingo María"},
    {id:"entregables", label:"Entregables o resultados (opcional, uno por línea)", type:"area", full:true, pulir:"lista de entregables, un elemento por línea, cada uno como frase nominal", ph:"Informe final\nPlanos en PDF"},
    {id:"inicio", label:"Fecha de inicio", type:"date", def:() => todayKey()},
    {id:"fin", label:"Fecha de término", type:"date", req:true},
    {t:"h", label:"Pago"},
    {id:"modo", label:"Cómo se paga", type:"select", opts:[["total","Un monto por todo el servicio"],["mensual","Un monto mensual"]], def:"total"},
    {id:"monto", label:"Monto (S/)", type:"money", req:true},
    {id:"pagoT", label:"Cuándo se paga", type:"select", opts:[["fin","Todo al terminar, con conformidad"],["partes","Adelanto y saldo al terminar"]], def:"fin", when:d => d.modo !== "mensual"},
    {id:"adelanto", label:"Adelanto (S/)", type:"money", when:d => d.modo !== "mensual" && d.pagoT === "partes"},
    {id:"dia", label:"Día de pago de cada mes", type:"num", def:"30", when:d => d.modo === "mensual"},
    {id:"recibo", label:"El locador emitirá recibo por honorarios", type:"check", def:true, full:true},
    {id:"mat", label:"Materiales y herramientas", type:"select", opts:[["EL LOCADOR","Los pone el locador (incluidos en el pago)"],["EL COMITENTE","Los pone quien contrata"]], def:"EL LOCADOR"},
    {t:"h", label:"Otras condiciones"},
    {id:"aviso", label:"Días de aviso para terminar antes", type:"num", def:"15"},
    {id:"penal", label:"Penalidad por día de retraso (S/, opcional)", type:"money"}
  ],
  titulo: () => "CONTRATO DE LOCACIÓN DE SERVICIOS",
  intro: d => { const emp = d.tipoCom === "empresa", fc = fem(d, "com");
    const comitente = emp ? "**" + UP(d.empresa) + "**, con RUC N° " + X(d.ruc) + ", con domicilio en " + X(d.domEmp) + ", debidamente representada por su " + X(d.repCargo) + ", " + (fc ? "doña" : "don") + " **" + UP(d.com_nombre) + "**, identificad" + (fc ? "a" : "o") + " con DNI N° " + X(d.com_dni) : persona({...d, com_dom:d.com_dom}, "com", {sinEc:true});
    return introPartes("contrato de locación de servicios", comitente, "EL COMITENTE", persona(d, "loc", {sinEc:true}) + (d.loc_ruc ? ", con RUC N° " + d.loc_ruc : "") + (d.loc_prof ? ", de profesión u oficio " + d.loc_prof : ""), "EL LOCADOR"); },
  firmas: d => [d.tipoCom === "empresa" ? {n:UP(d.com_nombre), d:X(d.com_dni), r:"EL COMITENTE (p. " + UP(d.empresa) + ")"} : firmaDoc(d, "com", "EL COMITENTE"), firmaDoc(d, "loc", "EL LOCADOR")],
  clausulas: [
    {id:"antec", h:"ANTECEDENTES", n:2, t:d => "EL COMITENTE requiere contratar los servicios de una persona que cuente con la experiencia y los medios necesarios para realizar el servicio que se describe en la cláusula siguiente. EL LOCADOR declara contar con la capacidad, la experiencia y los medios necesarios para prestarlo" + (d.loc_prof ? ", en su condición de " + d.loc_prof : "") + "."},
    {id:"objeto", h:"OBJETO", n:1, t:d => "Por el presente contrato, EL LOCADOR se obliga a prestar a EL COMITENTE, de manera personal y con autonomía, el siguiente servicio: " + X(V(d, "servicio")).replace(/\.$/, "") + (d.lugar ? ", en " + d.lugar.replace(/\.$/, "") : "") + "; a cambio de la retribución pactada en el presente contrato, conforme al artículo 1764 del Código Civil."},
    {id:"entregables", h:"ENTREGABLES", n:1, t:d => { const e = lineas(V(d, "entregables")); return e.length ? "Como resultado del servicio, EL LOCADOR entregará a EL COMITENTE lo siguiente: " + e.map((t, i) => String.fromCharCode(97 + i) + ") " + t.replace(/[.;]$/, "")).join("; ") + "." : null; }},
    {id:"plazo", h:"PLAZO", n:1, t:d => "El servicio se prestará desde el " + fechaLarga(d.inicio) + " hasta el " + fechaLarga(d.fin) + ". El plazo podrá ampliarse solo por acuerdo escrito de ambas partes."},
    {id:"pago", h:"RETRIBUCIÓN Y FORMA DE PAGO", n:1, t:d => { const monto = toC(d.monto), on = v => v !== false && v !== "false"; let pago;
      if (d.modo === "mensual") pago = "La retribución mensual por el servicio es de **" + montoTxt(monto) + "**, que EL COMITENTE pagará a más tardar el día " + X(d.dia) + " de cada mes, por los servicios prestados en dicho mes. De ser el caso, el primer y el último mes se pagarán en proporción a los días de servicio efectivamente prestados.";
      else if (d.pagoT === "partes") { const a = toC(d.adelanto), sal = monto > 0 && a > 0 ? monto - a : 0; pago = "La retribución total por el servicio es de **" + montoTxt(monto) + "**, que EL COMITENTE pagará de la siguiente manera: a) " + montoTxt(a) + " como adelanto, a la firma del presente contrato, que EL LOCADOR declara recibir; y b) el saldo de " + montoTxt(sal) + ", a la culminación del servicio, previa conformidad de EL COMITENTE."; }
      else pago = "La retribución total por el servicio es de **" + montoTxt(monto) + "**, que EL COMITENTE pagará a la culminación del servicio, previa conformidad.";
      return pago + " Dicho monto comprende todos los conceptos que EL LOCADOR pudiera requerir para cumplir el servicio" + (d.mat === "EL COMITENTE" ? ", con excepción de los materiales y herramientas, que serán proporcionados por EL COMITENTE." : ", incluidos los materiales y herramientas necesarios, que son de cargo de EL LOCADOR.") + (on(d.recibo) ? " Para cada pago, EL LOCADOR emitirá el recibo por honorarios electrónico correspondiente, y EL COMITENTE efectuará las retenciones que, de ser el caso, correspondan conforme a ley." : " EL LOCADOR firmará una constancia por cada pago recibido."); }},
    {id:"naturaleza", h:"NATURALEZA DEL CONTRATO", n:1, t:() => "El presente contrato es de naturaleza civil y se rige por los artículos 1764 al 1770 del Código Civil. EL LOCADOR presta el servicio con autonomía técnica y sin subordinación a EL COMITENTE, organizando su tiempo y la forma de ejecutarlo dentro de lo acordado. En consecuencia, entre las partes no existe relación laboral, y EL LOCADOR asume sus propias obligaciones tributarias y, de ser el caso, de seguridad social."},
    {id:"oblLoc", h:"OBLIGACIONES DE EL LOCADOR", n:2, t:() => "Son obligaciones de EL LOCADOR: a) prestar el servicio de manera personal, con diligencia y conforme a lo acordado, pudiendo valerse de auxiliares bajo su dirección y responsabilidad, conforme al artículo 1766 del Código Civil; b) cumplir los plazos pactados; c) informar a EL COMITENTE sobre el avance del servicio cuando este lo solicite; y d) responder por los daños que cause por su culpa en la ejecución del servicio."},
    {id:"oblCom", h:"OBLIGACIONES DE EL COMITENTE", n:2, t:() => "Son obligaciones de EL COMITENTE: a) pagar la retribución en la forma y oportunidad pactadas; b) brindar a EL LOCADOR la información, las facilidades y el acceso que sean necesarios para prestar el servicio; y c) dar su conformidad o formular sus observaciones por escrito dentro de los cinco (5) días siguientes a la culminación o entrega del servicio; vencido ese plazo sin observaciones, el servicio se tendrá por conforme."},
    {id:"penal", h:"PENALIDAD", n:2, t:d => { const pen = toC(d.penal); return pen > 0 ? "Si EL LOCADOR se retrasa injustificadamente en la ejecución o entrega del servicio, pagará a EL COMITENTE una penalidad de " + montoTxt(pen) + " por cada día de retraso, hasta un máximo equivalente al diez por ciento (10%) de la retribución " + (d.modo === "mensual" ? "mensual" : "total") + ", monto que podrá descontarse de los pagos pendientes, conforme a los artículos 1341 y siguientes del Código Civil." : null; }},
    {id:"confid", h:"CONFIDENCIALIDAD", n:2, t:() => "EL LOCADOR se obliga a guardar reserva sobre toda la información de EL COMITENTE a la que tenga acceso con motivo del servicio, y a no divulgarla ni utilizarla para fines distintos al presente contrato, obligación que se mantendrá vigente aun después de terminado el contrato."},
    {id:"propiedad", h:"PROPIEDAD DE LOS RESULTADOS", opt:true, t:() => "Los trabajos, documentos y demás resultados del servicio serán de propiedad de EL COMITENTE una vez pagada la retribución, quien podrá usarlos libremente para sus fines, sin perjuicio de los derechos morales que la ley reconoce a su autor."},
    {id:"seguridad", h:"SEGURIDAD Y DAÑOS A TERCEROS", n:3, t:() => "EL LOCADOR adoptará las medidas de seguridad necesarias para ejecutar el servicio y será responsable de los daños que, por su culpa o la de sus auxiliares, se causen a EL COMITENTE o a terceros durante su ejecución."},
    {id:"noExcl", h:"NO EXCLUSIVIDAD", n:3, t:() => "EL LOCADOR podrá prestar servicios a otras personas durante la vigencia del presente contrato, siempre que ello no afecte el cumplimiento oportuno del servicio pactado ni suponga el uso de información reservada de EL COMITENTE."},
    {id:"termino", h:"TERMINACIÓN ANTICIPADA Y RESOLUCIÓN", n:2, t:d => "Cualquiera de las partes podrá dar por terminado el presente contrato antes de su vencimiento, comunicándolo por escrito a la otra con una anticipación no menor de " + (parseInt(d.aviso, 10) ? letras(parseInt(d.aviso, 10)) + " (" + parseInt(d.aviso, 10) + ")" : "quince (15)") + " días calendario, en cuyo caso EL COMITENTE pagará los servicios efectivamente prestados hasta esa fecha. Asimismo, si una de las partes incumple sus obligaciones, la otra podrá requerirle por escrito que las cumpla en un plazo no menor de quince (15) días, bajo apercibimiento de que, en caso contrario, el contrato quede resuelto, conforme al artículo 1429 del Código Civil."}
  ]
}),

  ],
  titulo: () => "CONTRATO DE PRÉSTAMO DE DINERO (MUTUO)",

  clausulas: [
    {id:"objeto", h:"OBJETO", n:1, t:d => "Por el presente contrato, EL MUTUANTE entrega en préstamo a EL MUTUATARIO la suma de **" + montoTxt(toC(d.monto)) + "**, " + (d.entregaP === "deposito" ? "mediante depósito o transferencia bancaria, cuya constancia forma parte del presente contrato" : "en dinero en efectivo, a la firma del presente documento, que EL MUTUATARIO declara recibir a su entera satisfacción") + "; obligándose EL MUTUATARIO a devolver una cantidad igual en la forma y plazos pactados, conforme al artículo 1648 del Código Civil."},
    {id:"destino", h:"DESTINO DEL PRÉSTAMO", n:2, t:d => d.destino ? "EL MUTUATARIO declara que el dinero recibido será destinado a " + V(d, "destino").replace(/^para\s+/i, "").replace(/\.$/, "") + "." : null},
    {id:"interes", h:"INTERESES", n:1, t:d => { const tot = prestamoTotal(d); return d.interes === "si" ? "El presente préstamo genera un interés compensatorio del " + X(d.tasa) + "% mensual, que por todo el plazo asciende a " + montoTxt(tot - toC(d.monto)) + ", de modo que EL MUTUATARIO devolverá en total la suma de **" + montoTxt(tot) + "**. Las partes declaran que dicha tasa no excede la máxima permitida por el Banco Central de Reserva del Perú para operaciones entre personas ajenas al sistema financiero." : "El presente préstamo no genera intereses compensatorios."; }},
    {id:"devol", h:"DEVOLUCIÓN Y CRONOGRAMA", n:1, t:d => pagoTxt(d, prestamoTotal(d), "EL MUTUATARIO", "EL MUTUANTE"), li:d => cuotasTxt(d, prestamoTotal(d))},
    {id:"lugar", h:"LUGAR Y FORMA DE PAGO", n:2, t:d => lugarTxt(d, "EL MUTUANTE") + " EL MUTUATARIO podrá adelantar pagos en cualquier momento, reduciéndose proporcionalmente los intereses, de haberlos."},
    {id:"mora", h:"PENALIDAD POR ATRASO", n:2, t:d => toC(d.penal) > 0 ? "Por cada día de atraso en el pago de " + (d.forma === "unica" ? "la deuda" : "cualquier cuota") + ", EL MUTUATARIO pagará a EL MUTUANTE una penalidad de " + montoTxt(toC(d.penal)) + ", conforme a los artículos 1341 y siguientes del Código Civil." : null},

function prestamoTotal(d){
  const m = toC(d.monto); if (d.interes !== "si") return m;
  const tasa = parseFloat(String(d.tasa || "").replace(",", ".")) || 0; let meses;
  if (d.forma === "unica") meses = d.fechaUnica && d.fecha ? Math.max(1, Math.ceil((dateOfKey(d.fechaUnica) - dateOfKey(d.fecha)) / 864e5 / 30)) : 1;
  else { const n = Math.max(1, parseInt(d.ncuotas, 10) || 1); meses = d.periodo === "semanal" ? Math.max(1, Math.ceil(n * 7 / 30)) : d.periodo === "quincenal" ? Math.max(1, Math.ceil(n / 2)) : n; }
  return m + Math.round(m * tasa / 100 * meses);
}

function segsFromNode(n){
  const segs = [];
  const walk = (node, bold, it) => node.childNodes.forEach(ch => {
    if (ch.nodeType === 3) { if (ch.nodeValue) segs.push([ch.nodeValue.replace(/\s+/g, " "), bold, it]); }
    else if (ch.nodeName === "BR") segs.push([" ", bold, it]);
    else walk(ch, bold || ch.nodeName === "B" || ch.nodeName === "STRONG", it || ch.nodeName === "I" || ch.nodeName === "EM");
  });
  walk(n, false, false);
  return segs;
}
function cvParseNode(n){
  const k = n.dataset.k;
  if (k === "photo") return {k, src:n.getAttribute("src")};
  if (k === "cvname") { const nn = n.querySelector('[data-part="n"]'), ss = n.querySelector('[data-part="s"]'); return {k, t:nn ? nn.textContent.trim() : "", sub:ss ? ss.textContent.trim() : ""}; }
  if (k === "cvcontact" || k === "cvh") return {k, t:n.textContent.trim()};
  if (k === "cvrow" || k === "cvsub") return {k, l:segsFromNode(n.querySelector('[data-part="l"]')), r:segsFromNode(n.querySelector('[data-part="r"]'))};
  if (k === "bul" || k === "cvsum" || k === "cvp") return {k, s:segsFromNode(n)};
  return null;
}

    }); });

    return out;
  };

    const size = o.size || FS, lh = o.lh || LH, x0 = ML + (o.indent || 0), width = W - (o.indent || 0) - (o.reserve || 0);

function leerFoto(file){

function cvmFoto(src, shape){

const TOKEN_RE = /\{\{([a-zA-Z0-9_]+)(?:\|(may|monto|fecha|cierre))?\}\}/g;
function tokVal(d, id, kind){
  const v = d[id];
  if (kind === "may") return UP(v);
  if (kind === "monto") return montoTxt(toC(v));
  if (kind === "fecha") return fechaLarga(v);
  if (kind === "cierre") return fechaCierre(v);

}
const tokTxt = (s, d) => String(s).replace(TOKEN_RE, (m, id, k) => tokVal(d, id, k));
function modeloTpl(m){

// busca en el texto los datos que se llenaron en el formulario y los cambia por campos
function detectarCampos(tpl, d){
  const cands = [];
  const add = (id, label, type) => { const v = d[id]; if (v == null || typeof v === "object" || v === true || v === false) return; const s = String(v).trim(); if (s.length < 2 || s === "true" || s === "false") return; cands.push({id, label, type, v:s}); };
  tpl.campos.forEach(c => {
    if (c.t === "persona") { if (c.when && !c.when(d)) return; personaFields(c).forEach(f => { if (f.type !== "select" && !/_cel$/.test(f.id)) add(f.id, c.label + ": " + f.label.toLowerCase(), "text"); }); return; }
    if (c.t || (c.when && !c.when(d)) || c.type === "select" || c.type === "check" || c.type === "photo") return;
    add(c.id, c.label, c.type === "money" ? "money" : c.type === "date" ? "date" : "text");
  });

}
function tokenizar(blocks, cands){
  const reps = [];
  cands.forEach(c => {
    if (c.type === "money") { const m = toC(c.v); if (m > 0) reps.push([montoTxt(m), "{{" + c.id + "|monto}}", c]); }
    if (c.type === "date") { reps.push([fechaLarga(c.v), "{{" + c.id + "|fecha}}", c]); reps.push([fechaCierre(c.v), "{{" + c.id + "|cierre}}", c]); }
    if (c.type !== "date") { if (c.v.toUpperCase() !== c.v) reps.push([c.v.toUpperCase(), "{{" + c.id + "|may}}", c]); reps.push([c.v, "{{" + c.id + "}}", c]); }
  });
  reps.sort((a, b) => b[0].length - a[0].length);
  const usados = new Set();
  const sub = s => { let out = String(s); reps.forEach(([from, to, c]) => { if (from.length >= 2 && out.includes(from)) { out = out.split(from).join(to); usados.add(c.id); } }); return out; };
  const nb = blocks.map(b => b.k === "title" ? {k:"title", t:sub(b.t)} : b.k === "sign" ? {k:"sign", f:(b.f || []).map(f => ({...f, n:sub(f.n), d:sub(f.d), r:f.r}))} : {k:b.k, s:(b.s || []).map(([t, bo]) => [sub(t), !!bo])});
  return {blocks:nb, usados};
}

function guardarPersonas(tpl, d){
  let changed = false; const ids = [];
  if (tpl.cobro === "cv") {
    const nombre = String(d.nombre || "").trim(), cel = cel9(d.cel), dni = String(d.dni || "").replace(/\D/g, "");
    if (nombre && (cel || dni)) {
      let c = cli.clientes.find(x => (dni && x.dni === dni) || (cel && cel9(x.cel) === cel));
      if (!c) { c = {id:uid(), nombre, cel, creado:Date.now(), visitas:0, gastado:0}; cli.clientes.push(c); }
      if (/^Cliente \d{4}$/.test(c.nombre)) c.nombre = nombre;
      if (dni) c.dni = dni; if (d.dirCv && !c.dom) c.dom = d.dirCv; if (cel && !c.cel) c.cel = cel;
      saveCli(); ids.push(c.id);
    }
    return ids;
  }
  tpl.campos.filter(c => c.t === "persona" && !(c.when && !c.when(d))).forEach(c => {
    const p = c.id, nombre = String(d[p + "_nombre"] || "").trim(), dni = String(d[p + "_dni"] || "").replace(/\D/g, ""), cel = cel9(d[p + "_cel"]);
    if (!nombre || (!dni && !cel)) return;
    let cl = cli.clientes.find(x => (dni && x.dni === dni) || (cel && cel9(x.cel) === cel));
    if (!cl) { cl = {id:uid(), nombre, cel:"", creado:Date.now(), visitas:0, gastado:0}; cli.clientes.push(cl); }
    if (/^Cliente \d{4}$/.test(cl.nombre) || !cl.nombre) cl.nombre = nombre;
    Object.assign(cl, {dni: dni || cl.dni || "", dom: d[p + "_dom"] || cl.dom || "", trato: d[p + "_trato"] || cl.trato});
    if (cel && !cl.cel) cl.cel = cel;
    if (d[p + "_ec"]) cl.ec = d[p + "_ec"];
    if (d[p + "_cony"]) { cl.cony = d[p + "_cony"]; cl.conyDni = d[p + "_conyDni"] || ""; }
    changed = true; ids.push(cl.id);

}

/* ---- HTML del documento ---- */
function segsHTML(segs){ return (segs || []).map(([t, b, it]) => { let h = esc(t).replace(/\[COMPLETAR\]/g, "<mark>[COMPLETAR]</mark>"); if (it) h = "<i>" + h + "</i>"; return b ? "<b>" + h + "</b>" : h; }).join(""); }
const CVK = ["photo","cvname","cvcontact","cvh","cvrow","cvsub","bul","cvsum","cvp"];
function blocksHTML(bl){
  return bl.map(b => {
    if (CVK.includes(b.k)) return cvBlockHTML(b);
    if (b.k === "title") return `<h1 data-k="title" contenteditable="true">${esc(b.t)}</h1>`;
    if (b.k === "sign") return `<div data-k="sign" class="firmas${b.f.length === 1 ? " uno" : ""}" data-f="${esc(JSON.stringify(b.f))}">${b.f.map(f => `<div class="firma">${f.nh ? "" : `<div class="huella">Huella</div>`}<div class="linea"></div><b>${esc(f.n)}</b><br>DNI N° ${esc(f.d)}<br><span>${esc(f.r)}</span></div>`).join("")}</div>`;
    return `<p data-k="${b.k}" contenteditable="true">${segsHTML(b.s)}</p>`;
  }).join("");
}
// el HTML guardado de un documento nunca se inserta tal cual: se lee en un documento aparte (no ejecuta nada) y se reconstruye desde sus bloques
function sanitizeDocHTML(html){
  try { const d = new DOMParser().parseFromString("<div id='r'>" + String(html || "") + "</div>", "text/html"); return blocksHTML(parseDocDOM(d.getElementById("r"))); } catch(e) { return ""; }
}
function parseDocDOM(el){
  const out = [];
  el.querySelectorAll(":scope > [data-k]").forEach(n => {
    const k = n.dataset.k;
    if (CVK.includes(k)) { const x = cvParseNode(n); if (x) out.push(x); return; }
    if (k === "title") return out.push({k, t:n.textContent.trim()});
    if (k === "sign") { try { out.push({k, f:JSON.parse(n.dataset.f)}); } catch(e) {} return; }
    const segs = [];
    const walk = (node, bold) => node.childNodes.forEach(ch => {
      if (ch.nodeType === 3) { if (ch.nodeValue) segs.push([ch.nodeValue.replace(/\s+/g, " "), bold]); }
      else if (ch.nodeName === "BR") segs.push([" ", bold]);
      else walk(ch, bold || ch.nodeName === "B" || ch.nodeName === "STRONG");
    });
    walk(n, false);
    if (segs.some(s => s[0].trim())) out.push({k, s:segs});
  });
  return out;
}

/* ---- PDF A4 (texto real, justificado) ---- */
async function docPDF(blocks, measureOnly, style){
  if (style && String(style).startsWith("cv")) return cvPDF(blocks, measureOnly, style);
  blocks = blocks.map(b => b.s ? {...b, s:b.s.map(([t, ...r]) => [String(t).replace(/²/g, "2").replace(/³/g, "3"), ...r])} : b);
  const {jsPDF} = await loadJsPDF();
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = 210, PH = 297, ML = 30, MR = 25, MT = 25, MB = 25, W = PW - ML - MR;
  const FS = 11.5, LH = 5.9, PS = 3.2;
  let y = MT, pages = 1;
  const newPage = () => { doc.addPage(); pages++; y = MT; };
  const font = b => { doc.setFont("times", b ? "bold" : "normal"); doc.setFontSize(FS); };
  const mw = t => doc.getStringUnitWidth(t, {kerning:{}}) * doc.internal.getFontSize() / doc.internal.scaleFactor;
  const words = segs => {
    const out = []; let cur = null, pendSp = false;
    segs.forEach(([t, b]) => { (String(t).match(/\s+|[^\s]+/g) || []).forEach(tok => {
      if (/^\s+$/.test(tok)) { pendSp = true; cur = null; return; }
      if (cur && !pendSp) cur.parts.push({t:tok, b}); else { cur = {parts:[{t:tok, b}]}; out.push(cur); }
      pendSp = false;
    }); });
    out.forEach(w => { w.w = w.parts.reduce((a, p) => { font(p.b); return a + mw(p.t); }, 0); });
    return out;
  };
  const para = (segs, align, indent, ps = PS, keepH = 0, fi = 0) => {
    const x0 = ML + (indent || 0), width = W - (indent || 0);
    font(false); const sw = mw(" ");
    const ws = words(segs), lines = []; let line = [], lw = 0;
    const lim = () => width - (lines.length === 0 ? fi : 0);
    ws.forEach(w => { const add = line.length ? sw + w.w : w.w; if (lw + add > lim() && line.length) { lines.push({ws:line, w:lw}); line = [w]; lw = w.w; } else { line.push(w); lw += add; } });
    if (line.length) lines.push({ws:line, w:lw});
    const need = lines.length * LH + ps + keepH;
    if (keepH && y + need > PH - MB && need < PH - MT - MB) newPage();
    lines.forEach((ln, i) => {
      if (y + LH > PH - MB) newPage();
      if (!measureOnly) {
        const last = i === lines.length - 1, n = ln.ws.length, sumW = ln.ws.reduce((a, w) => a + w.w, 0);
        const ind = i === 0 ? fi : 0;
        let gap = sw, x = x0 + ind;
        if (align === "justify" && !last && n > 1) gap = (width - ind - sumW) / (n - 1);
        else if (align === "right") x = x0 + width - ln.w;
        else if (align === "center") x = x0 + (width - ln.w) / 2;
        ln.ws.forEach(w => { w.parts.forEach(p => { font(p.b); doc.text(p.t, x, y + LH * 0.78); x += mw(p.t); }); x += gap; });
      }
      y += LH;
    });
    y += ps;
  };
  const signH = b => 6 + Math.ceil(b.f.length / 2) * 46;
  let primerP = true;
  blocks.forEach((b, bi) => {
    if (b.k === "title") {
      doc.setFont("times", "bold"); doc.setFontSize(14);
      const lines = doc.splitTextToSize(b.t, W - 10);
      if (y + lines.length * 7 + 12 > PH - MB) newPage();
      if (!measureOnly) lines.forEach((l, i) => {
        const cx = ML + W / 2, by = y + 5 + i * 7, tw = mw(l);
        doc.text(l, cx, by, {align:"center"});
        doc.setDrawColor(17); doc.setLineWidth(0.3); doc.setLineDashPattern([], 0); doc.line(cx - tw/2, by + 1.2, cx + tw/2, by + 1.2);
      });
      y += lines.length * 7 + 9; return;
    }
    if (b.k === "sign") {
      const cols = 2, colW = W / cols, h = 46;
      const rows = Math.ceil(b.f.length / cols);
      if (y + signH(b) > PH - MB && signH(b) < PH - MT - MB) newPage();
      y += 6;
      for (let r = 0; r < rows; r++) {
        if (y + h > PH - MB) newPage();
        if (!measureOnly) b.f.slice(r*cols, r*cols + cols).forEach((f, i) => {
          const cx = b.f.length === 1 ? ML + W / 2 - (f.nh ? 0 : 8) : ML + colW * i + colW / 2 - 8, top = y + 22;
          doc.setDrawColor(20); doc.setLineDashPattern([], 0); doc.line(cx - 30, top, cx + 30, top);
          if (!f.nh) { doc.setDrawColor(150); doc.rect(cx + 33, top - 26, 18, 22);
          doc.setFont("times", "normal"); doc.setFontSize(7); doc.setTextColor(140); doc.text("Huella", cx + 42, top - 1.5, {align:"center"}); doc.setTextColor(17); }
          doc.setFont("times", "bold"); doc.setFontSize(9.5);
          const nl = doc.splitTextToSize(f.n, 64); nl.forEach((l, j) => doc.text(l, cx, top + 4.5 + j * 4.2, {align:"center"}));
          doc.setFont("times", "normal"); doc.setFontSize(9.5);
          doc.text("DNI N° " + f.d, cx, top + 4.5 + nl.length * 4.2, {align:"center"});
          doc.text(f.r, cx, top + 4.5 + (nl.length + 1) * 4.2, {align:"center"});
        });

async function downloadCSV(daysMap, filename){
  const q = s => '"' + String(s).replace(/^([=+\-@])/, "'$1").replace(/"/g,'""') + '"';
  const out = [["Fecha","Hora","Servicio","Detalle","Cantidad","Precio unit.","Subtotal","Total venta","Pago","Comprobante","Vendedor"].join(";")];
  Object.keys(daysMap).sort().forEach(k => (daysMap[k].ventas||[]).forEach(v => v.items.forEach(l => out.push([fdate(dateOfKey(k).getTime()), fhm(v.t), q(l.nombre), q(l.det||""), l.cant, N(l.precio), N(l.sub), N(v.total), metodoName(v.metodo), l.tercero ? "Tasa de terceros" : v.boleta ? "Boleta" : propio(v) > LIMIT ? "Pendiente" : "Cierre del dia", q(v.vend || "")].join(";")))));
  try { await downloads.save({filename, data:"\ufeff" + out.join("\r\n")}); toast("Archivo descargado"); }
  catch(e) { if (e && e.code !== "declined") toast("No se pudo descargar"); }
}

let repSt = {r:"mes", from:"", to:"", orden:"g"};
const REP_R = [["hoy","Hoy"],["7","7 días"],["30","30 días"],["mes","Este mes"],["mespas","Mes pasado"],["anio","Este año"],["custom","Elegir fechas"]];
const nDias = (a, b) => Math.round((dateOfKey(b) - dateOfKey(a)) / 864e5) + 1;
function repRango(r){
  const t = todayKey(), d = dateOfKey(t);
  if (r === "hoy") return [t, t];
  if (r === "7") return [addDays(t, -6), t];
  if (r === "30") return [addDays(t, -29), t];
  if (r === "mes") return [t.slice(0, 8) + "01", t];
  if (r === "mespas") return [keyOf(new Date(d.getFullYear(), d.getMonth() - 1, 1)), keyOf(new Date(d.getFullYear(), d.getMonth(), 0))];
  if (r === "anio") return [t.slice(0, 4) + "-01-01", t];
  const a = repSt.from || addDays(t, -6), b = repSt.to || t; return a <= b ? [a, b] : [b, a];
}
// periodo con el que se compara: el mes anterior hasta el mismo día, o los días justo antes
function rangoPrevio(a, b, r){
  const d = dateOfKey(a);
  if (r === "mes") { const pa = new Date(d.getFullYear(), d.getMonth() - 1, 1), fin = new Date(d.getFullYear(), d.getMonth(), 0), pb = new Date(pa); pb.setDate(pa.getDate() + nDias(a, b) - 1); return [keyOf(pa), keyOf(pb > fin ? fin : pb)]; }
  if (r === "mespas") return [keyOf(new Date(d.getFullYear(), d.getMonth() - 1, 1)), keyOf(new Date(d.getFullYear(), d.getMonth(), 0))];
  const n = nDias(a, b); return [addDays(a, -n), addDays(a, -1)];
}
const grupoDe = (sid, cm) => sid === "pedido" || sid === "encargo" ? "Pedidos y encargos" : (cm[sid] || {}).g || "Otros";
const vacioVend = () => ({v:0, n:0, desc:0, anul:0, anulM:0, dif:0});
// todas las cuentas de un periodo a partir de los días (soloDia = solo lo que vive en el documento del día, para el resumen diario)
function repCalc(data, a, b, soloDia){

  Object.keys(data).filter(k => k >= a && k <= b).forEach(k => { const D = data[k] || {}; let dv = 0;
    (D.ventas || []).forEach(v => { const p = propio(v); R.ventas += p; dv += p; R.n++; R.tasas += terc(v); R.desc += v.descuento || 0; if (v.metodo === "fiado") R.fiado += p;
      const m = v.metodo || "efectivo"; R.met[m] = (R.met[m] || 0) + p;
      if (v.cliente) { R.conCliente += p; const c = (R.clientes[v.cliente] ||= {n:0, v:0}); c.n++; c.v += p; }
      const VV = (R.vend[v.vend || "Sin usuario"] ||= vacioVend()); VV.v += p; VV.n++; VV.desc += v.descuento || 0;
      const dt = new Date(v.t), hk = dt.getDay() + "-" + dt.getHours(); R.heat[hk] = (R.heat[hk] || 0) + p;

async function repPDF(R, P, a, b, prods, grupos, vendRows){

  const tabla = (cols, rows) => { need(8); F("bold", 9); let x = ML; cols.forEach(c => { doc.text(c.t, c.r ? x + c.w - 1 : x, y, c.r ? {align:"right"} : undefined); x += c.w; }); y += 1.6; doc.setDrawColor(200); doc.line(ML, y, ML + W, y); y += 4.4;
    rows.forEach(rw => { need(6); F("normal", 9); let x2 = ML; rw.forEach((v, i) => { const c = cols[i], s = doc.splitTextToSize(String(v), c.w - 2)[0]; doc.text(s, c.r ? x2 + c.w - 1 : x2, y, c.r ? {align:"right"} : undefined); x2 += c.w; }); y += 5; }); };
  F("bold", 17); doc.text((negocio.nombre || "").toUpperCase(), ML, y); F("normal", 9, [90,90,90]); doc.text("RUC " + (negocio.ruc || "") + " · " + (negocio.dir || ""), ML, y + 5.5);
  F("bold", 13); doc.text("REPORTE DE GESTIÓN", ML + W, y, {align:"right"}); F("normal", 9.5, [90,90,90]); doc.text(fdate(dateOfKey(a).getTime()) + " al " + fdate(dateOfKey(b).getTime()), ML + W, y + 5.5, {align:"right"});
  y += 14;

  h2("Resultado");
  fila("Vendido", S(R.ventas) + dp(R.ventas, P && P.ventas)); fila("Costo de lo vendido (conocido en el " + R.cobertura + "%)", "- " + N(R.cogs)); fila("Gastos", "- " + N(R.gastos)); if (R.perd) fila("Pérdidas de inventario", "- " + N(R.perd));
  fila("GANANCIA", S(R.ganancia) + dp(R.ganancia, P && P.ganancia), true);
  fila("Ventas / ticket promedio", R.n + " / " + S(R.n ? Math.round(R.ventas / R.n) : 0));
  h2("Dinero que entró y salió");
  fila("Cobrado en ventas", S(R.ventas - R.fiado)); fila("Cobrado de fiados", S(R.cobFiado)); if (R.ingresos) fila("Otros ingresos", S(R.ingresos));
  fila("Gastos", "- " + N(R.gastos)); fila("Pagos a proveedores", "- " + N(R.pagTot)); if (R.retiros) fila("Retiros", "- " + N(R.retiros)); fila("Saldo", S(R.entra - R.sale), true);
  fila("Vendido al fiado (por cobrar)", S(R.fiado)); fila("Descuentos dados", S(R.desc)); if (R.sinCobrar) fila("Copias sin cobrar según contadores", fmtN(R.sinCobrar) + " ≈ " + S(R.sinCobrarS));
  if (grupos.length) { h2("Por grupo"); tabla([{t:"Grupo", w:90}, {t:"Vendido", w:30, r:true}, {t:"%", w:18, r:true}, {t:"Ganancia", w:40, r:true}], grupos.map(([g, x]) => [g, N(x.v), Math.round(x.v / (R.bruto || 1) * 100) + "%", x.cub ? N(x.cub - x.c) : "sin costo"])); }
  if (prods && prods.length) { h2("Lo que más te deja"); tabla([{t:"Producto o servicio", w:88}, {t:"Cant.", w:20, r:true}, {t:"Vendido", w:30, r:true}, {t:"Ganancia", w:40, r:true}], prods.slice(0, 12).map(x => [x.n, fmtN(x.cant), N(x.v), x.gan != null ? N(x.gan) : "sin costo"])); }
  if (vendRows && vendRows.length) { h2("Por vendedor"); tabla([{t:"Vendedor", w:50}, {t:"Vendido", w:28, r:true}, {t:"Ventas", w:18, r:true}, {t:"Descuentos", w:26, r:true}, {t:"Anuladas", w:26, r:true}, {t:"Caja", w:30, r:true}], vendRows.map(([n, x]) => [n, N(x.v), x.n, N(x.desc), x.anul ? x.anul + " (" + N(x.anulM) + ")" : "—", x.dif ? (x.dif > 0 ? "+" : "-") + N(Math.abs(x.dif)) : "cuadra"])); }
  if (R.gastos) { h2("Gastos por concepto"); Object.entries(R.gasC).sort((x, z) => z[1] - x[1]).forEach(([c, v]) => fila(c, S(v))); }

  F("normal", 8, [120,120,120]); doc.text("Generado el " + fdate(Date.now()) + " " + fhm(Date.now()) + ". Ganancia = vendido - costo de lo vendido - gastos - pérdidas.", PW / 2, PH - 10, {align:"center"});
  doc.setProperties({title:"Reporte " + a + " a " + b, author:negocio.nombre});
  return doc.output("blob");
}

function leerQR(file, max = 480){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const x = cv.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.imageSmoothingEnabled = k < 1; x.drawImage(img, 0, 0, w, h);
      let url = cv.toDataURL("image/png"); if (url.length > 110000) url = cv.toDataURL("image/jpeg", 0.88); if (url.length > 150000) url = cv.toDataURL("image/jpeg", 0.7);
      res(url);
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function prodHTML(){

          ${i.ops.length ? `<label>Código de barras<input data-cb="${i.id}" value="${esc(i.cb || "")}" placeholder="Escanéalo aquí" style="width:150px"></label>` : ""}
